[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-tools"
dynamic = ["version"]
description = "User-friendly SIGAA and public SIPAC UFPB client (CLI + MCP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Puca Vaz" },
]
keywords = ["sigaa", "sipac", "ufpb", "mcp", "cli", "academic"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "keyring>=24",
    "pypdf>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/PucaVaz/sigaa-tools"
Repository = "https://github.com/PucaVaz/sigaa-tools"
Issues = "https://github.com/PucaVaz/sigaa-tools/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
# Optional Metal GPU backend for the ALTCHA proof-of-work (macOS only; the
# shader compiles at runtime, no Xcode needed). Without it the CPU solver runs.
metal = ["pyobjc-framework-Metal>=10.0; sys_platform == 'darwin'"]
# Optional CUDA GPU backend for the same proof-of-work (NVIDIA; Windows and
# Linux). The kernel compiles at runtime through NVRTC, so no CUDA Toolkit or
# nvcc is needed; only the NVIDIA driver. Without it the CPU solver runs.
cuda = [
    "cuda-bindings>=12.6; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc>=12.6; sys_platform != 'darwin'",
]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
sigaa = "sigaa.cli:main"
sigaa-mcp = "sigaa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sigaa*"]

[tool.setuptools.dynamic]
version = {attr = "sigaa.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly rather than inherited. ruff's default selection widened in
# 0.16, which turned a green CI red on an unchanged tree; this is the set the
# codebase was actually written against.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

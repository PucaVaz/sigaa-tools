[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-ai-agent"
version = "0.1.0"
description = "User-friendly SIGAA UFPB client (CLI + MCP) for automation workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Puca Vaz" },
]
keywords = ["sigaa", "ufpb", "mcp", "cli", "academic"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/PucaVaz/sigaa-for-ai-agents"
Repository = "https://github.com/PucaVaz/sigaa-for-ai-agents"

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
sigaa = "sigaa.cli:main"
sigaa-mcp = "sigaa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sigaa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

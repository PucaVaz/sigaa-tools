[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-tools"
dynamic = ["version"]
description = "User-friendly SIGAA and public SIPAC UFPB client (CLI + MCP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Puca Vaz" },
]
keywords = ["sigaa", "sipac", "ufpb", "mcp", "cli", "academic"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "keyring>=24",
    "pypdf>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/PucaVaz/sigaa-for-ai-agents"
Repository = "https://github.com/PucaVaz/sigaa-for-ai-agents"

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
sigaa = "sigaa.cli:main"
sigaa-mcp = "sigaa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sigaa*"]

[tool.setuptools.dynamic]
version = {attr = "sigaa.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

<!-- Synthetic fixture: an extension opportunity search with no results. SIGAA
     re-renders the search form under a warning alert and no results form. -->
<html>
<head><title>SIGAA - Sistema Integrado de Gest&#227;o de Atividades Acad&#234;micas</title></head>
<body>
<div id="conteudo">
<div class="alert alert-warning alert-dismissible" role="alert">
	<button type="button" class="close" data-dismiss="alert"><span aria-hidden="true">&times;</span><span class="sr-only">Fechar</span></button>
	<div class="icone"><span class="glyphicon glyphicon-exclamation-sign"></span></div>
	<div class="conteudo">
		<ul>
			<li>Nenhuma oportunidade foi encontrada de acordo com os crit&#233;rios de busca informados.</li>
		</ul>
	</div>
</div>
<h2><a href='/sigaa/portal/discente/'>Portal do Discente</a> &gt; Vagas de Bolsas Dispon&#237;veis na UFPB</h2>
<form id="busca" name="busca" method="post" action="/sigaa/graduacao/agregador_bolsa/busca.jsf" enctype="application/x-www-form-urlencoded">
<input type="hidden" name="busca" value="busca" />
<table class="formulario" width="80%">
<caption>Buscar Oportunidades</caption>
<tbody>
<tr>
	<td width="5%"></td>
	<th class="obrigatorio">Tipo de bolsa:</th>
	<td><select id="busca:tipo" name="busca:tipo" size="1" onchange="return mostrarFiltrosOportunidades();">
		<option value="-1">--- SELECIONE O TIPO DE BOLSA DE SEU INTERESSE ---</option>
		<option value="1">MONITORIA</option>
		<option value="2" selected="selected">EXTENS&#195;O</option>
		<option value="3">PESQUISA</option>
		<option value="4">APOIO T&#201;CNICO</option>
		<option value="5">A&#199;&#213;ES ASSOCIADAS</option>
	</select></td>
</tr>
<tr id="linhaAnoAtividade" style="display: none;">
	<td width="5%"></td>
	<th class="obrigatorio">Ano:</th>
	<td><input id="busca:buscaAnoAtividade" type="text" name="busca:buscaAnoAtividade" value="2026" maxlength="4" size="4" /></td>
</tr>
<tr id="linhaTipoAtividade" style="display: none;">
	<td><input id="busca:tipoAtividadeCheck" type="checkbox" name="busca:tipoAtividadeCheck" /></td>
	<td>Tipo Atividade:</td>
	<td><select id="busca:tipoAtividade" name="busca:tipoAtividade" size="1">
		<option value="3">CURSO</option>
		<option value="2">PROJETO</option>
	</select></td>
</tr>
<tr id="linhaServidor" style="display: none;">
	<td><input id="busca:servidorCheck" type="checkbox" name="busca:servidorCheck" /></td>
	<td>Orientador:</td>
	<td><input id="busca:nome" type="text" name="busca:nome" />
		<input type="hidden" id="busca:idServidor" name="busca:idServidor" value="0" /></td>
</tr>
<tr id="linhaCentro" style="display: none;">
	<td><input id="busca:centroCheck" type="checkbox" name="busca:centroCheck" /></td>
	<td>Centro:</td>
	<td><select id="busca:centro" name="busca:centro" size="1">
		<option value="1632">CCAE - CENTRO DE CI&#202;NCIAS APLICADAS E EDUCA&#199;&#195;O</option>
		<option value="2564">CCTA - CENTRO DE COMUNICA&#199;&#195;O, TURISMO E ARTES</option>
	</select></td>
</tr>
<tr id="linhaUnidadeAdm" style="display: none;">
	<td><input id="busca:unidadeAdmCheck" type="checkbox" name="busca:unidadeAdmCheck" /></td>
	<td>Unidade:</td>
	<td><select id="busca:unidadeAdm" name="busca:unidadeAdm" size="1"></select></td>
</tr>
</tbody>
<tfoot>
<tr><td colspan="3">
	<input type="submit" name="busca:btaoBuscar" value="Buscar" />
	<input type="submit" name="busca:btaoCancel" value="Cancelar" />
</td></tr>
</tfoot>
</table>
<input type="hidden" name="javax.faces.ViewState" id="javax.faces.ViewState" value="j_id3" />
</form>
</div>
</body>
</html>
